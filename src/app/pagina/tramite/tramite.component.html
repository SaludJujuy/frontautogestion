<button mat-raised-button color="warn" (click)="salir()">
  <mat-label><strong>SALIR</strong></mat-label>
</button>

<div class="nombre-prestador">
  <h1 *ngIf="prestadorElegido?.Nombre"><strong>{{ prestadorElegido.Nombre }}</strong></h1>
</div>

<div class="contenedor-flex">

  <div class="columna-inputs">
    <mat-card class="buscador-card">
      <div class="text-center">
        <h1><strong>INGRESE NUMERO DE SOBRE</strong></h1>
      </div>
      <mat-form-field appearance="outline" class="input-full">
        <mat-label>Número de Sobre</mat-label>
        <input  #inputSobre type="number"
       [(ngModel)]="sobre"
       matInput
       placeholder="Ingrese número de sobre"
       (focus)="campoActivo = 'sobre'"
       (input)="verificarLongitudSobre()"
       (keydown.enter)="registrarTramite()" 
       [ngClass]="{'input-error': inputSobreInvalido}"
        (mousedown)="evitarClick($event)"
       class="no-click"
       />
      </mat-form-field>
    </mat-card>

    <mat-card class="buscador-card">
      <div class="text-center">
        <h1><strong>INGRESE CANTIDAD DE CONSULTAS</strong></h1>
      </div>
      <mat-form-field appearance="outline" class="input-full">
        <mat-label></mat-label>
        <input #inputConsulta type="number"
       [(ngModel)]="consulta"
       matInput
       placeholder="Ingrese cantidad de consultas"
       (focus)="campoActivo = 'consulta'"
       (keydown.enter)="registrarTramite()"
       [ngClass]="{'input-error': inputConsultaInvalido}"
        (mousedown)="evitarClick($event)"
       class="no-click"/>
      </mat-form-field>
    </mat-card>

    <mat-card class="buscador-card">
      <div class="text-center">
        <h1><strong>INGRESE CANTIDAD DE PRÁCTICAS</strong></h1>
      </div>
      <mat-form-field appearance="outline" class="input-full">
        <mat-label></mat-label>
        <input #inputPractica 
        type="number" 
        [(ngModel)]="practica" 
        matInput placeholder="Ingrese cantidad de prácticas"
         (focus)="campoActivo = 'practica'"  
         (keydown.enter)="registrarTramite()"
         [ngClass]="{'input-error': inputPracticaInvalido}"
         (mousedown)="evitarClick($event)"
         class="no-click"/>
      </mat-form-field>
    </mat-card>
  </div>


  <div class="columna-teclado">
    <h1 class="text-center">TECLADO NUMÉRICO</h1>
    <div class="teclado-container">

      <button mat-raised-button style="background-color: rgb(190, 179, 179 );" *ngFor="let tecla of teclas"
    (click)="agregarNumero(tecla)">
    {{ tecla }}
  </button>

  <button mat-raised-button color="primary" (click)="siguientePaso()" *ngIf="pasoActual < 3">
    <h1>Siguiente</h1>
  </button>

  <button mat-raised-button color="accent" class="aceptar-button" (click)="registrarTramite()" *ngIf="pasoActual === 3">
    <h1>Imprimir</h1>
  </button>

  <button mat-raised-button color="warn" (click)="borrar()">
    borrar
  </button>
    </div>
  </div>
</div>
